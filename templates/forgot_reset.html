<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Νέος Κωδικός — Που τα ξοδεύω</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="auth-icon">🔐</span>
            <span class="auth-title">Νέος Κωδικός</span>
        </div>
        <h2 class="auth-heading">Όρισε νέο κωδικό</h2>
        <p class="auth-subtitle">
            Η ερώτηση ασφαλείας απαντήθηκε σωστά.
            Πληκτρολόγησε τον νέο σου κωδικό.
        </p>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/forgot/reset" class="auth-form" onsubmit="return validateForm()">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>Νέος Κωδικός <span class="label-hint">(8+, κεφαλαίο, αριθμός, σύμβολο)</span></label>
                <div class="pw-wrap">
                    <input type="password" name="new_password" id="newPw" placeholder="••••••••" required>
                    <button type="button" class="pw-toggle" onclick="togglePw('newPw', this)">👁</button>
                </div>
                <div class="pw-strength" id="pwStrength"></div>
            </div>

            <div class="form-group">
                <label>Επιβεβαίωση</label>
                <div class="pw-wrap">
                    <input type="password" name="confirm" id="confirmPw" placeholder="••••••••" required>
                    <button type="button" class="pw-toggle" onclick="togglePw('confirmPw', this)">👁</button>
                </div>
                <div class="field-hint" id="confirmHint"></div>
            </div>

            <button type="submit" class="btn btn-primary auth-btn">Αποθήκευση Νέου Κωδικού</button>
        </form>

        <div class="auth-footer">
            <a href="/login">← Πίσω στη Σύνδεση</a>
        </div>
    </div>
</div>
<script>
function togglePw(id, btn) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
    btn.textContent = el.type === 'password' ? '👁' : '🙈';
}

const pwEl = document.getElementById('newPw');
const strengthEl = document.getElementById('pwStrength');

pwEl.addEventListener('input', function() {
    const v = this.value;
    let score = 0, tips = [];
    if (v.length >= 8) score++; else tips.push('8+ χαρακτήρες');
    if (/[A-Z]/.test(v)) score++; else tips.push('κεφαλαίο γράμμα');
    if (/[0-9]/.test(v)) score++; else tips.push('αριθμό');
    if (/[^A-Za-z0-9]/.test(v)) score++; else tips.push('σύμβολο (!@#...)');
    const labels = ['','Αδύναμος','Μέτριος','Καλός','Ισχυρός'];
    const colors = ['','#e74c3c','#f39c12','#3498db','#27ae60'];
    strengthEl.innerHTML = v.length
        ? `<span style="color:${colors[score]}">${labels[score]}</span>${tips.length ? ' — λείπει: '+tips.join(', ') : ' ✓'}`
        : '';
});

document.getElementById('confirmPw').addEventListener('input', function() {
    const hint = document.getElementById('confirmHint');
    hint.textContent = this.value === pwEl.value ? '✓ Ταιριάζουν' : '✕ Δεν ταιριάζουν';
    hint.style.color = this.value === pwEl.value ? '#27ae60' : '#e74c3c';
});

function validateForm() {
    const p = pwEl.value;
    const c = document.getElementById('confirmPw').value;
    if (!/[A-Z]/.test(p) || !/[0-9]/.test(p) || !/[^A-Za-z0-9]/.test(p) || p.length < 8) {
        alert('Ο κωδικός δεν πληροί τις απαιτήσεις'); return false;
    }
    if (p !== c) { alert('Οι κωδικοί δεν ταιριάζουν'); return false; }
    return true;
}
</script>
</body>
</html>
